; Open Clock-In: reloj control con huella — placa LCDWiki ES3C35P (ESP32-S3, 3.5" 320x480 ST77922 QSPI)
; Compilar:  pio run          Grabar:  pio run -t upload
[platformio]
default_envs = reloj

[env:reloj]
platform = espressif32@6.6.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
; Puerto USB nativo: el "stub" de esptool se cuelga a veces en esta placa (visto en NerdMiner)
upload_speed = 921600
upload_flags = --no-stub
build_flags =
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D LV_CONF_INCLUDE_SIMPLE
	-I include
	-D CORE_DEBUG_LEVEL=1
lib_deps =
	lvgl/lvgl@9.2.2
	adafruit/Adafruit Fingerprint Sensor Library@2.1.3
	bblanchon/ArduinoJson@7.2.1
