; Prueba del lector de huella: ver src/main.cpp. Se graba en vez del reloj y se vuelve a grabar el reloj después.
[env:probar-lector]
platform = espressif32@6.6.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
monitor_speed = 115200
upload_speed = 921600
upload_flags = --no-stub
build_flags = -D BOARD_HAS_PSRAM -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1
